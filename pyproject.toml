[project]
name = "mota"
version = "1.0.0"
description = "Mota - Agentic PCB demo: native CLI + PySide6 desktop with a Mota-owned circuit/PCB engine"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mota" }]
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "platformdirs>=4.2",
  "keyring>=25.0",
  "argon2-cffi>=23.1",
  "openai>=1.40",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
  "PyOpenGL>=3.1.7",
  "numpy>=1.26",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "sexpdata>=1.0",
  "jsonschema>=4.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-timeout>=2.3", "pyinstaller>=6.0"]

[project.scripts]
mota = "mota.cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mota"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
