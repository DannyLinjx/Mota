rule_profile_id: mota_2layer_1oz_v1
version: 1
kind: project_rule_profile
description: >-
  Two-layer FR-4, 1 oz copper demo process for this project. Chosen so the
  0.20 mm gap of the LQFP-48 0.5 mm pitch footprint is manufacturable without
  widening or waiving the real pads. Power and ground use 0.30 mm, which still
  carries the board's <=0.5 A branch currents (1 oz, ~0.8 A at 10 C rise) and
  leaves a 0.20 mm gap when a supply pin leaves a 0.5 mm pitch row.
  Not a general capability guarantee.
source: >-
  JLCPCB PCB capabilities (1-2 layer, 1 oz: 0.10/0.10 mm trace/space,
  0.15 mm SMD pad spacing), queried 2026-10-22.
layers: [F.Cu, B.Cu]
thickness_mm: 1.6
clearance_mm: 0.15
track_width_signal_mm: 0.20
track_width_power_mm: 0.30
board_edge_clearance_mm: 0.30
npth_copper_clearance_mm: 0.25
via_outer_mm: 0.60
via_drill_mm: 0.30
via_annular_ring_mm: 0.15
routing_grid_mm: 0.127
routing_budget_seconds: 240
schematic_snap_mm: 1.27
required_for_review:
  - PIN_PAD_MAPPING
  - NET_COMPLETENESS
  - REQUIRED_CONNECTIONS
  - VOLTAGE_DOMAIN
  - SUPPLY_DECOUPLING
  - SCHEMATIC_PCB_CONSISTENCY
  - VISIBLE_TEXT
  - ROUTING_COMPLETE
  - DRC_CLEARANCE
  - DRC_BOARD_EDGE
  - DRC_TRACK_WIDTH
  - DRC_VIA
  - DRC_HOLES
  - COURTYARD
  - COPPER_CONNECTIVITY
  - COPPER_SHORTS
non_blocking_examples:
  - THERMAL_ESTIMATE
  - EMC
  - INTERFACE_ASSUMPTION
  - LED_PHYSICAL_POLARITY
