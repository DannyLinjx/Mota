id: i2c_temperature
version: 1
title: I2C Temperature Board
subtitle: A temperature-sensor board for an external controller.
description: >
  An Analog Devices DS1621+ digital thermometer on a 3.3 V, 100 kHz 2-wire bus.
  A0/A1/A2 are tied low for address 0x48, TOUT is explicitly not connected, and
  SDA/SCL each have a 3.3k pull-up. The external master and cable are outside
  this board; the bus capacitance target is an interface assumption.
status: candidate
validation_profile: mota_demo_2layer_v1
modules: [dc_input_4pin, ds1621_sensor, i2c_pullups, address_strap, power_decoupling]
required_fields: [supply_voltage_v, bus_frequency_khz]
defaults:
  supply_voltage_v: 3.3
  bus_frequency_khz: 100
  address: "0x48"
  board_width_mm: 40
  board_height_mm: 30
  board_thickness_mm: 1.6
constraints:
  supply_voltage_v: {min: 3.0, max: 3.6}
  bus_frequency_khz: {min: 1, max: 100}
  layer_count: {const: 2}
board:
  width_mm: 40
  height_mm: 30
  thickness_mm: 1.6
  mounting_holes:
    - {x_mm: 3.5, y_mm: 3.5, drill_mm: 3.2}
    - {x_mm: 36.5, y_mm: 26.5, drill_mm: 3.2}
parts:
  - {reference: J1, part_id: conn_1x04, value: "3V3/GND/SDA/SCL", module: dc_input_4pin, rotation: 90}
  - {reference: R1, part_id: r_3k3, value: 3.3k, module: i2c_pullups, rotation: 90}
  - {reference: R2, part_id: r_3k3, value: 3.3k, module: i2c_pullups, rotation: 90}
  - {reference: U1, part_id: ds1621_plus, value: DS1621+, module: ds1621_sensor}
  - {reference: C1, part_id: c_100n_50v, value: 100nF, module: power_decoupling}
nets:
  - {name: 3V3, class: power, voltage_v: 3.3, pins: [J1:1, U1:8, R1:1, R2:1, C1:1]}
  - {name: GND, class: ground, pins: [J1:2, U1:4, U1:5, U1:6, U1:7, C1:2]}
  - {name: SDA, class: signal, pins: [J1:3, U1:1, R1:2]}
  - {name: SCL, class: signal, pins: [J1:4, U1:2, R2:2]}
no_connects:
  - U1:3
placement:
  - {ref: J1, fx: 0.00, fy: 0.50, rotation: 90}
  - {ref: R1, fx: 0.30, fy: 0.18, rotation: 90}
  - {ref: R2, fx: 0.30, fy: 0.82, rotation: 90}
  - {ref: U1, fx: 0.58, fy: 0.50}
  - {ref: C1, fx: 0.86, fy: 0.50}
required_checks:
  - PIN_PAD_MAPPING
  - DS1621_PINMAP
  - NET_COMPLETENESS
  - REQUIRED_CONNECTIONS
  - I2C_PULLUPS
  - I2C_ADDRESS_STRAP
  - DS1621_TOUT_NC
  - SUPPLY_DECOUPLING
  - VOLTAGE_DOMAIN
  - INTERFACE_ASSUMPTION
  - SCHEMATIC_PCB_CONSISTENCY
  - ROUTING_COMPLETE
  - DRC_CLEARANCE
  - DRC_BOARD_EDGE
  - DRC_TRACK_WIDTH
  - DRC_HOLES
  - COPPER_CONNECTIVITY
  - COPPER_SHORTS
source_ids: [D3, SPEC-R, SPEC-C, SPEC-CONN]
