id: power_3v3
version: 1
title: 3.3 V Power Board
subtitle: A small regulated supply for low-current devices.
description: >
  A 5 V nominal input feeding an MCP1700-3302E/TO fixed 3.3 V LDO with input and
  output capacitors and two 2-pin headers. Intended for a 50 mA demonstration load.
status: candidate
validation_profile: mota_demo_2layer_v1
modules: [dc_input_2pin, mcp1700_to92_3v3, power_decoupling, dc_output_2pin]
required_fields: [input_voltage_v, max_load_ma]
defaults:
  input_voltage_v: 5.0
  max_load_ma: 50
  output_voltage_v: 3.3
  board_width_mm: 40
  board_height_mm: 30
  board_thickness_mm: 1.6
constraints:
  input_voltage_v: {min: 4.75, max: 5.25}
  max_load_ma: {min: 0, max: 50}
  output_voltage_v: {min: 3.234, max: 3.366}
  layer_count: {const: 2}
board:
  width_mm: 40
  height_mm: 30
  thickness_mm: 1.6
  mounting_holes:
    - {x_mm: 3.5, y_mm: 3.5, drill_mm: 3.2}
    - {x_mm: 36.5, y_mm: 26.5, drill_mm: 3.2}
parts:
  - {reference: J1, part_id: conn_1x02, value: "5V IN", module: dc_input_2pin, rotation: 90}
  - {reference: C1, part_id: c_2u2_50v, value: 2.2uF, module: power_decoupling}
  - {reference: U1, part_id: mcp1700_3302e_to, value: MCP1700-3302E/TO, module: mcp1700_to92_3v3}
  - {reference: C2, part_id: c_2u2_50v, value: 2.2uF, module: power_decoupling}
  - {reference: J2, part_id: conn_1x02, value: "3V3 OUT", module: dc_output_2pin, rotation: 90}
nets:
  - {name: VIN_5V, class: power, voltage_v: 5.0, pins: [J1:1, U1:2, C1:1]}
  - {name: GND, class: ground, pins: [J1:2, C1:2, U1:1, C2:2, J2:2]}
  - {name: VOUT_3V3, class: power, voltage_v: 3.3, pins: [U1:3, C2:1, J2:1]}
no_connects: []
placement:
  - {ref: J1, fx: 0.00, fy: 0.50, rotation: 90}
  - {ref: C1, fx: 0.25, fy: 0.22}
  - {ref: U1, fx: 0.50, fy: 0.55}
  - {ref: C2, fx: 0.75, fy: 0.35}
  - {ref: J2, fx: 1.00, fy: 0.50, rotation: 90}
required_checks:
  - PIN_PAD_MAPPING
  - MCP1700_TO92_PINMAP
  - NET_COMPLETENESS
  - REQUIRED_CONNECTIONS
  - SUPPLY_DECOUPLING
  - VOLTAGE_DOMAIN
  - OUTPUT_CAP_EFFECTIVE
  - OUTPUT_CAP_ESR
  - SCHEMATIC_PCB_CONSISTENCY
  - ROUTING_COMPLETE
  - DRC_CLEARANCE
  - DRC_BOARD_EDGE
  - DRC_TRACK_WIDTH
  - DRC_HOLES
  - COPPER_CONNECTIVITY
  - COPPER_SHORTS
source_ids: [D1, SPEC-R, SPEC-C, SPEC-CONN]
